# PasokMataram local infrastructure stack

services:
  postgres:
    image: postgres:18
    container_name: pasokmataram-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Tama123}
      POSTGRES_DB: ${DB_NAME:-pasokmataram_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-root} -d ${DB_NAME:-pasokmataram_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pasokmataram-net

  redis:
    image: redis:7-alpine
    container_name: pasokmataram-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pasokmataram-net

  minio:
    image: coollabsio/minio:latest
    container_name: pasokmataram-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - pasokmataram-net

  adminer:
    image: adminer:latest
    container_name: pasokmataram-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    networks:
      - pasokmataram-net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  pasokmataram-net:
    driver: bridge
