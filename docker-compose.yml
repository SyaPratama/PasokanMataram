# PasokMataram local infrastructure stack

services:
  mysql:
    image: mysql:8.0
    container_name: pasokmataram-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Tama123}
      MYSQL_DATABASE: ${DB_NAME:-pasokmataram_db}
      MYSQL_USER: ${DB_USER:-pasok_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-Tama123}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-Tama123}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pasokmataram-net

  minio:
    image: coollabsio/minio:latest
    container_name: pasokmataram-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - pasokmataram-net

  adminer:
    image: adminer:latest
    container_name: pasokmataram-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - mysql
    networks:
      - pasokmataram-net

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: pasokmataram-api
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-pasok_user}
      DB_PASSWORD: ${DB_PASSWORD:-Tama123}
      DB_NAME: ${DB_NAME:-pasokmataram_db}
      DB_SSL: "false"
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      ML_SERVICE_URL: http://ml-service:8000
      SOLOSMARTPAY_TOKEN: ${SOLOSMARTPAY_TOKEN:-ssp_test_pasokmataram_demo}
      SOLOSMARTPAY_WEBHOOK_SECRET: ${SOLOSMARTPAY_WEBHOOK_SECRET:-ssp_secret_default_key}
    ports:
      - "3001:3001"
    depends_on:
      - mysql
    networks:
      - pasokmataram-net

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: pasokmataram-web
    restart: unless-stopped
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://api:3001/api/v1
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - pasokmataram-net

  queue-worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: pasokmataram-queue-worker
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-pasok_user}
      DB_PASSWORD: ${DB_PASSWORD:-Tama123}
      DB_NAME: ${DB_NAME:-pasokmataram_db}
      DB_SSL: "false"
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
    depends_on:
      - mysql
    networks:
      - pasokmataram-net

  ml-service:
    build:
      context: ../MLPasokanMataram
      dockerfile: Dockerfile
    container_name: pasokmataram-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - pasokmataram-net

volumes:
  mysql_data:
  minio_data:

networks:
  pasokmataram-net:
    driver: bridge
