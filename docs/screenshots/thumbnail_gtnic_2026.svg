<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3622"/>
      <stop offset="60%" stop-color="#2E5339"/>
      <stop offset="100%" stop-color="#122416"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B85324"/>
      <stop offset="100%" stop-color="#D48028"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Decorative geometric accents -->
  <circle cx="1700" cy="200" r="450" fill="#24422D" opacity="0.3"/>
  <circle cx="100" cy="900" r="350" fill="#B85324" opacity="0.15"/>
  <rect x="0" y="0" width="1920" height="16" fill="url(#accent)"/>
  <rect x="0" y="1064" width="1920" height="16" fill="url(#accent)"/>

  <!-- Competition Badge -->
  <g transform="translate(120, 100)">
    <rect width="780" height="56" rx="28" fill="#B85324" filter="url(#shadow)"/>
    <text x="390" y="36" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="2">GARDA TECH NATIONAL INNOVATION COMPETITION 2026</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(120, 260)">
    <text x="0" y="80" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="96" font-weight="900" letter-spacing="-1">Pasok<tspan fill="#D48028">Mataram</tspan></text>
    <text x="0" y="150" fill="#EAF0EB" font-family="'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="700">Platform B2B SaaS Pengadaan Kolektif Pangan DIY</text>
    <text x="0" y="210" fill="#D8C6AE" font-family="'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="400">Rantai Pasok Agrikultur Terintegrasi Petani &amp; HoReKa D.I. Yogyakarta</text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(120, 560)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="380" height="68" rx="16" fill="#24422D" stroke="#6E8B6E" stroke-width="2"/>
    <text x="190" y="42" fill="#EAF0EB" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Collective Group Buying</text>

    <!-- Pill 2 -->
    <rect x="410" y="0" width="360" height="68" rx="16" fill="#24422D" stroke="#6E8B6E" stroke-width="2"/>
    <text x="590" y="42" fill="#EAF0EB" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Escrow Bank BPD DIY</text>

    <!-- Pill 3 -->
    <rect x="800" y="0" width="410" height="68" rx="16" fill="#24422D" stroke="#6E8B6E" stroke-width="2"/>
    <text x="1005" y="42" fill="#EAF0EB" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">AI Price Forecast (LightGBM)</text>

    <!-- Pill 4 -->
    <rect x="1240" y="0" width="380" height="68" rx="16" fill="#24422D" stroke="#6E8B6E" stroke-width="2"/>
    <text x="1430" y="42" fill="#EAF0EB" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">SNI Cold-Chain &amp; Tera Digital</text>
  </g>

  <!-- Card Preview Box on Right -->
  <g transform="translate(120, 680)">
    <rect width="1680" height="240" rx="24" fill="#122416" stroke="#2E5339" stroke-width="3" filter="url(#shadow)"/>

    <g transform="translate(50, 60)">
      <text x="0" y="30" fill="#D48028" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" letter-spacing="3">DEMO &amp; CASE STUDY RESMI</text>
      <text x="0" y="80" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800">Video Walkthrough Aplikasi Produksi (3-5 Menit)</text>
      <text x="0" y="125" fill="#EAF0EB" font-family="'Segoe UI', Roboto, sans-serif" font-size="22">Mencakup 5 Modul: Publik, HoReKa Buyer, Gapoktan Supplier, Sentra Hub Tera, &amp; Super Admin</text>
    </g>

    <!-- Play button graphic -->
    <g transform="translate(1480, 55)">
      <circle cx="65" cy="65" r="55" fill="url(#accent)" filter="url(#shadow)"/>
      <polygon points="55,42 90,65 55,88" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Footer Team Info -->
  <g transform="translate(120, 1000)">
    <text x="0" y="0" fill="#D8C6AE" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600">Disusun Oleh Tim: <tspan fill="#FFFFFF">Tim Inovasi PasokMataram (Rasya Putra Pratama &amp; Ibnu Sabil)</tspan> • Universitas Teknologi Yogyakarta</text>
  </g>
</svg>