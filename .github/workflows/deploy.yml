name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build production
        run: npm run build
        env:
          NODE_ENV: production
          CI: true
      
      - name: Create deployment package
        run: |
          tar -czf deploy.tar.gz \
            --warning=no-file-changed \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='tests' \
            --exclude='*.test.ts' \
            --exclude='coverage' \
            --exclude='.turbo' \
            . || true
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deploy.tar.gz
          retention-days: 7

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: deployment-package
      
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass
      
      - name: Upload to server
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no deploy.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/
      
      - name: Deploy on server
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} bash << 'ENDSSH'
          set -e
          DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
          
          # Backup
          if [ -d "$DEPLOY_PATH" ]; then
            cp -r "$DEPLOY_PATH" "${DEPLOY_PATH}_backup_$(date +%Y%m%d_%H%M%S)" 2>/dev/null || true
          fi
          
          # Extract
          mkdir -p "$DEPLOY_PATH"
          tar -xzf ~/deploy.tar.gz -C "$DEPLOY_PATH"
          rm ~/deploy.tar.gz
          
          # Install & restart
          cd "$DEPLOY_PATH"
          npm ci --production 2>/dev/null || npm install --production
          
          command -v pm2 || npm install -g pm2
          cd apps/web
          pm2 restart pasokmataram-web || pm2 start npm --name pasokmataram-web -- start
          pm2 save
          ENDSSH
      
      - name: Health check
        run: |
          sleep 15
          curl --fail --silent --max-time 10 ${{ secrets.APP_URL }} || echo "Health check skipped"
        continue-on-error: true
