name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '20.x'

jobs:
  build-web:
    name: Build Web (Next.js Standalone Artifacts)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Create environment files
        run: |
          echo "${{ secrets.ENV_DEVELOPMENT }}" > apps/web/.env.development
          echo "${{ secrets.ENV_PRODUCTION }}" > apps/web/.env.production
      
      - name: Run database migrations & smart seeding
        run: |
          if [ -z "$DB_HOST" ] || [ -z "$DB_PASSWORD" ]; then
            echo "::error::Database secrets (DB_HOST / DB_PASSWORD) are required for mandatory production deployment migration."
            exit 1
          fi
          npm run db:migrate
          npm run db:seed
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        continue-on-error: false
      
      - name: Build web with Next.js standalone output
        run: npm run build -- --filter=@pasok/web
        env:
          NODE_ENV: production
          CI: true
          STANDALONE: 'true'
          NEXT_OUTPUT_STANDALONE: 'true'
      - name: Package web standalone build (artifacts only, no TS sources)
        run: |
          mkdir -p web-dist
          cp -r apps/web/.next/standalone/* web-dist/
          mkdir -p web-dist/apps/web/.next
          cp -r apps/web/.next/static web-dist/apps/web/.next/
          cp -r apps/web/public web-dist/apps/web/
          cp apps/web/public/.htaccess web-dist/.htaccess
          cat << 'SERVER_JS_EOF' > web-dist/server.js
          import fs from 'fs';
          import path from 'path';

          const rawAppMode = (
            process.env.NODE_ENV ||
            process.env.PASSENGER_APP_ENV ||
            process.env.APP_ENV ||
            process.env.APPLICATION_MODE ||
            'production'
          ).toLowerCase();

          const isDev = rawAppMode === 'development' || rawAppMode === 'dev';
          const primaryEnv = isDev ? '.env.development' : '.env.production';
          const fallbackEnv = isDev ? '.env.production' : '.env.development';

          function parseAndInjectEnv(filename) {
            const envFilePath = path.resolve(process.cwd(), filename);
            if (!fs.existsSync(envFilePath)) return false;
            try {
              const fileContent = fs.readFileSync(envFilePath, 'utf8');
              for (const line of fileContent.split('\n')) {
                const trimmed = line.trim();
                if (!trimmed || trimmed.startsWith('#')) continue;
                const eqIdx = trimmed.indexOf('=');
                if (eqIdx === -1) continue;
                const key = trimmed.slice(0, eqIdx).trim();
                let val = trimmed.slice(eqIdx + 1).trim();
                if ((val.startsWith('"') && val.endsWith('"')) || (val.startsWith("'") && val.endsWith("'"))) {
                  val = val.slice(1, -1);
                }
                if (key && process.env[key] === undefined) {
                  process.env[key] = val;
                }
              }
              return true;
            } catch {
              return false;
            }
          }

          const loaded = parseAndInjectEnv(primaryEnv);
          if (!loaded) {
            parseAndInjectEnv(fallbackEnv);
          }

          process.env.NODE_ENV = isDev ? 'development' : 'production';
          process.env.NEXT_PUBLIC_APP_MODE = isDev ? 'development' : 'production';

          import('./apps/web/server.js');
          SERVER_JS_EOF
          cp web-dist/server.js web-dist/app.js
          cp apps/web/.env.production web-dist/.env.production 2>/dev/null || true
          cp apps/web/.env.development web-dist/.env.development 2>/dev/null || true
          cd web-dist
          tar -czf ../web-build.tar.gz .
      
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web-build.tar.gz
          retention-days: 7

  build-api:
    name: Build API (Bundled Artifacts)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Create environment files
        run: |
          echo "${{ secrets.ENV_DEVELOPMENT }}" > apps/api/.env.development
          echo "${{ secrets.ENV_PRODUCTION }}" > apps/api/.env.production
      
      - name: Bundle API with esbuild (compiled JS only, no TS sources)
        run: |
          npx esbuild apps/api/src/main.ts --bundle --platform=node --target=node20 --format=esm --packages=external --outfile=apps/api/dist/main.js
      
      - name: Package API build (artifacts only, no TS sources)
        run: |
          mkdir -p api-dist/dist
          cp apps/api/dist/main.js api-dist/dist/
          cat << 'SERVER_JS_EOF' > api-dist/server.js
          import fs from 'fs';
          import path from 'path';

          const rawAppMode = (
            process.env.NODE_ENV ||
            process.env.PASSENGER_APP_ENV ||
            process.env.APP_ENV ||
            process.env.APPLICATION_MODE ||
            'production'
          ).toLowerCase();

          const isDev = rawAppMode === 'development' || rawAppMode === 'dev';
          const primaryEnv = isDev ? '.env.development' : '.env.production';
          const fallbackEnv = isDev ? '.env.production' : '.env.development';

          function parseAndInjectEnv(filename) {
            const envFilePath = path.resolve(process.cwd(), filename);
            if (!fs.existsSync(envFilePath)) return false;
            try {
              const fileContent = fs.readFileSync(envFilePath, 'utf8');
              for (const line of fileContent.split('\n')) {
                const trimmed = line.trim();
                if (!trimmed || trimmed.startsWith('#')) continue;
                const eqIdx = trimmed.indexOf('=');
                if (eqIdx === -1) continue;
                const key = trimmed.slice(0, eqIdx).trim();
                let val = trimmed.slice(eqIdx + 1).trim();
                if ((val.startsWith('"') && val.endsWith('"')) || (val.startsWith("'") && val.endsWith("'"))) {
                  val = val.slice(1, -1);
                }
                if (key && process.env[key] === undefined) {
                  process.env[key] = val;
                }
              }
              return true;
            } catch {
              return false;
            }
          }

          const loaded = parseAndInjectEnv(primaryEnv);
          if (!loaded) {
            parseAndInjectEnv(fallbackEnv);
          }

          process.env.NODE_ENV = isDev ? 'development' : 'production';

          import('./dist/main.js');
          SERVER_JS_EOF
          cp api-dist/server.js api-dist/app.js
          cp apps/api/package.json api-dist/
          cp -r node_modules api-dist/
          cp apps/api/.env.production api-dist/.env.production 2>/dev/null || true
          cp apps/api/.env.development api-dist/.env.development 2>/dev/null || true
          cd api-dist
          tar -czf ../api-build.tar.gz .
      
      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-build
          path: api-build.tar.gz
          retention-days: 7

  deploy-web:
    name: Deploy Web to Server
    runs-on: ubuntu-latest
    needs: [build-web]
    if: github.ref == 'refs/heads/main'
    env:
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
    
    steps:
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
      
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass
      
      - name: Upload web build to server
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ConnectionAttempts=5 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"
          for i in 1 2 3; do
            echo "Upload attempt $i of 3 on port ${{ env.SSH_PORT }}..."
            if sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -P "${{ env.SSH_PORT }}" $SSH_OPTS \
              web-build.tar.gz \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/; then
              echo "Upload succeeded."
              exit 0
            fi
            echo "Upload attempt $i failed. Retrying in 5 seconds..."
            sleep 5
          done
          echo "Upload failed after 3 attempts."
          exit 255
      
      - name: Extract web build on server
        run: |
          cat << 'REMOTE_SCRIPT' > deploy-web-remote.sh
          set -e
          WEB_PATH="${{ secrets.WEB_DEPLOY_PATH }}"
          
          mkdir -p "$WEB_PATH"
          if [ -f "$WEB_PATH/.htaccess" ]; then
            cp "$WEB_PATH/.htaccess" /tmp/preserved_web_htaccess 2>/dev/null || true
          fi
          
          if [ -d "$WEB_PATH" ]; then
            cp -r "$WEB_PATH" "${WEB_PATH}_backup_$(date +%Y%m%d_%H%M%S)" 2>/dev/null || true
            ls -dt ${WEB_PATH}_backup_* 2>/dev/null | tail -n +3 | xargs rm -rf 2>/dev/null || true
          fi
          
          tar -xzf ~/web-build.tar.gz -C "$WEB_PATH" 2>/dev/null || true
          rm -f ~/web-build.tar.gz
          if [ -f /tmp/preserved_web_htaccess ]; then
            if grep -q "CLOUDLINUX" /tmp/preserved_web_htaccess 2>/dev/null; then
              cat /tmp/preserved_web_htaccess > "$WEB_PATH/.htaccess"
            fi
            rm -f /tmp/preserved_web_htaccess
          fi
          
          if ! grep -q "ErrorDocument 404" "$WEB_PATH/.htaccess" 2>/dev/null; then
            echo "" >> "$WEB_PATH/.htaccess"
            echo "Options -Indexes" >> "$WEB_PATH/.htaccess"
            echo "DirectoryIndex disabled" >> "$WEB_PATH/.htaccess"
            echo "ErrorDocument 400 /" >> "$WEB_PATH/.htaccess"
            echo "ErrorDocument 401 /" >> "$WEB_PATH/.htaccess"
            echo "ErrorDocument 403 /403" >> "$WEB_PATH/.htaccess"
            echo "ErrorDocument 404 /404" >> "$WEB_PATH/.htaccess"
            echo "ErrorDocument 500 /" >> "$WEB_PATH/.htaccess"
            echo "ErrorDocument 502 /" >> "$WEB_PATH/.htaccess"
            echo "ErrorDocument 503 /" >> "$WEB_PATH/.htaccess"
            echo '<FilesMatch "^\.env|^\.git">' >> "$WEB_PATH/.htaccess"
            echo "    Order allow,deny" >> "$WEB_PATH/.htaccess"
            echo "    Deny from all" >> "$WEB_PATH/.htaccess"
            echo "</FilesMatch>" >> "$WEB_PATH/.htaccess"
          fi
          
          mkdir -p "$WEB_PATH/tmp" && touch "$WEB_PATH/tmp/restart.txt"
          if command -v pm2 >/dev/null 2>&1; then
            pm2 restart pasokmataram-web 2>/dev/null || pm2 start "$WEB_PATH/server.js" --name pasokmataram-web || true
            pm2 save 2>/dev/null || true
          fi
          
          echo "Web deployed successfully with pure build artifacts and preserved .htaccess"
          REMOTE_SCRIPT

          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ConnectionAttempts=5 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"
          for i in 1 2 3; do
            echo "Deploy attempt $i of 3 on port ${{ env.SSH_PORT }}..."
            if sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -p "${{ env.SSH_PORT }}" $SSH_OPTS \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "bash -l" < deploy-web-remote.sh; then
              echo "Deploy succeeded."
              rm -f deploy-web-remote.sh
              exit 0
            fi
            echo "Deploy attempt $i failed. Retrying in 5 seconds..."
            sleep 5
          done
          rm -f deploy-web-remote.sh
          echo "Deploy failed after 3 attempts."
          exit 255
      
      - name: Health check web
        run: |
          sleep 15
          curl --fail --silent --max-time 10 ${{ secrets.WEB_URL }} || echo "Web health check skipped"
        continue-on-error: true

  deploy-api:
    name: Deploy API to Server
    runs-on: ubuntu-latest
    needs: [deploy-web, build-api]
    if: github.ref == 'refs/heads/main'
    env:
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
    
    steps:
      - name: Download API build
        uses: actions/download-artifact@v4
        with:
          name: api-build
      
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass
      
      - name: Upload API build to server
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ConnectionAttempts=5 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"
          for i in 1 2 3; do
            echo "Upload attempt $i of 3 on port ${{ env.SSH_PORT }}..."
            if sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -P "${{ env.SSH_PORT }}" $SSH_OPTS \
              api-build.tar.gz \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/; then
              echo "Upload succeeded."
              exit 0
            fi
            echo "Upload attempt $i failed. Retrying in 5 seconds..."
            sleep 5
          done
          echo "Upload failed after 3 attempts."
          exit 255
      
      - name: Extract API build on server
        run: |
          cat << 'REMOTE_SCRIPT' > deploy-api-remote.sh
          set -e
          API_PATH="${{ secrets.API_DEPLOY_PATH }}"
          
          mkdir -p "$API_PATH"
          if [ -f "$API_PATH/.htaccess" ]; then
            cp "$API_PATH/.htaccess" /tmp/preserved_api_htaccess 2>/dev/null || true
          fi
          
          if [ -d "$API_PATH" ]; then
            cp -r "$API_PATH" "${API_PATH}_backup_$(date +%Y%m%d_%H%M%S)" 2>/dev/null || true
            ls -dt ${API_PATH}_backup_* 2>/dev/null | tail -n +3 | xargs rm -rf 2>/dev/null || true
          fi
          
          tar -xzf ~/api-build.tar.gz -C "$API_PATH" 2>/dev/null || true
          rm -f ~/api-build.tar.gz
          
          if [ -f /tmp/preserved_api_htaccess ]; then
            if grep -q "CLOUDLINUX" /tmp/preserved_api_htaccess 2>/dev/null; then
              cat /tmp/preserved_api_htaccess > "$API_PATH/.htaccess"
            fi
            rm -f /tmp/preserved_api_htaccess
          fi
          
          if ! grep -q "ErrorDocument 404" "$API_PATH/.htaccess" 2>/dev/null; then
            echo "" >> "$API_PATH/.htaccess"
            echo "Options -Indexes" >> "$API_PATH/.htaccess"
            echo "DirectoryIndex disabled" >> "$API_PATH/.htaccess"
            echo "ErrorDocument 400 /" >> "$API_PATH/.htaccess"
            echo "ErrorDocument 401 /" >> "$API_PATH/.htaccess"
            echo "ErrorDocument 403 /403" >> "$API_PATH/.htaccess"
            echo "ErrorDocument 404 /404" >> "$API_PATH/.htaccess"
            echo "ErrorDocument 500 /" >> "$API_PATH/.htaccess"
            echo "ErrorDocument 502 /" >> "$API_PATH/.htaccess"
            echo "ErrorDocument 503 /" >> "$API_PATH/.htaccess"
            echo '<FilesMatch "^\.env|^\.git">' >> "$API_PATH/.htaccess"
            echo "    Order allow,deny" >> "$API_PATH/.htaccess"
            echo "    Deny from all" >> "$API_PATH/.htaccess"
            echo "</FilesMatch>" >> "$API_PATH/.htaccess"
          fi
          
          mkdir -p "$API_PATH/tmp" && touch "$API_PATH/tmp/restart.txt"
          if command -v pm2 >/dev/null 2>&1; then
            pm2 restart pasokmataram-api 2>/dev/null || pm2 start "$API_PATH/server.js" --name pasokmataram-api || true
            pm2 save 2>/dev/null || true
          fi
          
          echo "API deployed successfully with pure build artifacts and preserved .htaccess"
          REMOTE_SCRIPT

          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ConnectionAttempts=5 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"
          for i in 1 2 3; do
            echo "Deploy attempt $i of 3 on port ${{ env.SSH_PORT }}..."
            if sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -p "${{ env.SSH_PORT }}" $SSH_OPTS \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "bash -l" < deploy-api-remote.sh; then
              echo "Deploy succeeded."
              rm -f deploy-api-remote.sh
              exit 0
            fi
            echo "Deploy attempt $i failed. Retrying in 5 seconds..."
            sleep 5
          done
          rm -f deploy-api-remote.sh
          echo "Deploy failed after 3 attempts."
          exit 255
      
      - name: Health check API
        run: |
          sleep 15
          curl --fail --silent --max-time 10 ${{ secrets.API_URL }}/health || echo "API health check skipped"
        continue-on-error: true

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-web, deploy-api]
    if: always() && github.ref == 'refs/heads/main'
    
    steps:
      - name: Generate summary
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Component | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Web (Next.js) | ${{ needs.deploy-web.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| API (NestJS) | ${{ needs.deploy-api.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Author: @${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Time: $(date -u)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: .env.development + .env.production from GitHub Secrets" >> "$GITHUB_STEP_SUMMARY"
