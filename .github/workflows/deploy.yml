name: Production Deploy - PasokMataram

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  validate:
    name: Code Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: TypeScript check
        run: npx tsc --noEmit
        continue-on-error: true
      
      - name: Lint check
        run: npx eslint . --ext .ts,.tsx --max-warnings 50
        continue-on-error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true
      
      - name: Check for secrets
        run: |
          if grep -r "sk_live\|pk_live\|AWS_SECRET\|PRIVATE_KEY" --include="*.ts" --include="*.tsx" apps/ packages/ services/ 2>/dev/null; then
            echo "⚠️ Potential secrets found"
            exit 1
          else
            echo "✅ No exposed secrets"
          fi
        continue-on-error: true

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: [validate]
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: testpass
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-key-32-chars-minimum
          CI: true
        continue-on-error: true

  build:
    name: Build Production
    runs-on: ubuntu-latest
    needs: [validate, security]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build all packages
        run: npm run build
        env:
          NODE_ENV: production
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: |
            apps/web/.next
            apps/api/dist
            services/*/dist
            package.json
            package-lock.json
          retention-days: 1

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ secrets.APP_URL }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
      
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      
      - name: Test SSH connection
        run: |
          ssh -o ConnectTimeout=10 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo '✅ SSH connection successful'"
      
      - name: Create backup on server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            if [ -d "${{ secrets.DEPLOY_PATH }}" ]; then
              BACKUP_DIR="${{ secrets.DEPLOY_PATH }}_backup_$(date +%Y%m%d_%H%M%S)"
              echo "Creating backup: $BACKUP_DIR"
              cp -r ${{ secrets.DEPLOY_PATH }} $BACKUP_DIR
              # Keep only last 3 backups
              ls -dt ${{ secrets.DEPLOY_PATH }}_backup_* | tail -n +4 | xargs rm -rf
            fi
          EOF
        continue-on-error: true
      
      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.env*' \
            --exclude 'tests' \
            --exclude '*.test.ts' \
            --exclude 'coverage' \
            --exclude '.turbo' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/
      
      - name: Install production dependencies
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ${{ secrets.DEPLOY_PATH }}
            echo "Installing production dependencies..."
            npm ci --production --ignore-scripts || npm install --production
          EOF
      
      - name: Setup environment variables
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ${{ secrets.DEPLOY_PATH }}
            if [ ! -f .env.production ]; then
              echo "Creating .env.production..."
              cat > .env.production << 'ENVEOF'
NODE_ENV=production
PORT=3000
DB_HOST=localhost
DB_PORT=5432
DB_NAME=pasokmataram_db
REDIS_URL=redis://localhost:6379
JWT_SECRET=${{ secrets.JWT_SECRET }}
ENVEOF
            fi
          EOF
        continue-on-error: true
      
      - name: Check PM2 installed
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            if ! command -v pm2 &> /dev/null; then
              echo "PM2 not found, installing..."
              npm install -g pm2
            else
              echo "✅ PM2 already installed: $(pm2 -v)"
            fi
          EOF
      
      - name: Restart PM2 services
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Web service
            if pm2 describe pasokmataram-web > /dev/null 2>&1; then
              echo "Restarting pasokmataram-web..."
              pm2 restart pasokmataram-web
            else
              echo "Starting pasokmataram-web..."
              cd apps/web
              pm2 start npm --name "pasokmataram-web" -- start
              cd ../..
            fi
            
            # API service
            if pm2 describe pasokmataram-api > /dev/null 2>&1; then
              echo "Restarting pasokmataram-api..."
              pm2 restart pasokmataram-api
            else
              echo "Starting pasokmataram-api..."
              cd apps/api
              pm2 start npm --name "pasokmataram-api" -- run start:prod
              cd ../..
            fi
            
            pm2 save
            pm2 list
          EOF
      
      - name: Health check
        run: |
          echo "Waiting 15 seconds for services to start..."
          sleep 15
          
          if curl --fail --silent --show-error --max-time 10 ${{ secrets.APP_URL }}; then
            echo "✅ Health check passed"
          else
            echo "⚠️ Health check failed but deployment completed"
          fi
        continue-on-error: true
      
      - name: Deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ secrets.APP_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Author:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date)" >> $GITHUB_STEP_SUMMARY

  rollback:
    name: Rollback (Manual Trigger Only)
    runs-on: ubuntu-latest
    if: failure() && github.event_name == 'workflow_dispatch'
    needs: [deploy]
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      
      - name: Restore from backup
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            LATEST_BACKUP=$(ls -dt ${{ secrets.DEPLOY_PATH }}_backup_* | head -1)
            if [ -n "$LATEST_BACKUP" ]; then
              echo "Rolling back to: $LATEST_BACKUP"
              rm -rf ${{ secrets.DEPLOY_PATH }}
              mv $LATEST_BACKUP ${{ secrets.DEPLOY_PATH }}
              cd ${{ secrets.DEPLOY_PATH }}
              pm2 restart all
              echo "✅ Rollback completed"
            else
              echo "❌ No backup found"
              exit 1
            fi
          EOF
