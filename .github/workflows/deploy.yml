name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '22.x'

jobs:
  build-web:
    name: Build Web (Next.js Standalone Artifacts)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild argon2 against the target Node ABI
        run: |
          npm rebuild argon2 --build-from-source
          ls -1 node_modules/argon2/prebuilds/linux-x64 2>/dev/null || true

      - name: Create environment files
        run: |
          printf '%s\n' "$ENV_DEVELOPMENT" > apps/web/.env.development
          printf '%s\n' "$ENV_PRODUCTION" > apps/web/.env.production
          production_jwt_secret="$(awk -F= '$1 == "JWT_SECRET" {sub(/^[^=]*=/, ""); print; exit}' apps/web/.env.production)"
          production_jwt_secret="${production_jwt_secret#\"}"
          production_jwt_secret="${production_jwt_secret%\"}"
          if [ "${#production_jwt_secret}" -lt 32 ]; then
            echo "::error::ENV_PRODUCTION must contain JWT_SECRET with at least 32 characters."
            exit 1
          fi
          echo "::add-mask::$production_jwt_secret"
          printf 'JWT_SECRET=%s\n' "$production_jwt_secret" >> "$GITHUB_ENV"
          unset production_jwt_secret
        env:
          ENV_DEVELOPMENT: ${{ secrets.ENV_DEVELOPMENT }}
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}

      - name: Build web with Next.js standalone output
        run: |
          if [ "${#JWT_SECRET}" -lt 32 ]; then
            echo "::error::JWT_SECRET from ENV_PRODUCTION is missing or shorter than 32 characters."
            exit 1
          fi
          npm run build -- --filter=@pasok/web
        env:
          NODE_ENV: production
          CI: true
          STANDALONE: 'true'
          NEXT_OUTPUT_STANDALONE: 'true'

      - name: Package web standalone build (artifacts only, no TS sources)
        run: |
          mkdir -p web-dist
          cp -r apps/web/.next/standalone/* web-dist/
          for module_root in $(find web-dist -type d -name node_modules); do
            cp -r node_modules/argon2 "$module_root/"
          done
          find apps/web/.next/standalone -path '*argon2*' | head -10
          ls -1 web-dist/node_modules/argon2/prebuilds/linux-x64 2>/dev/null || echo "no linux-x64 prebuilds"
          ls -1 web-dist/node_modules/argon2/build/Release 2>/dev/null || echo "no argon2 build/Release"
          mkdir -p web-dist/apps/web/.next
          cp -r apps/web/.next/static web-dist/apps/web/.next/
          cp -r apps/web/public web-dist/apps/web/
          cp apps/web/public/.htaccess web-dist/.htaccess
          mkdir -p web-dist/schema
          cp packages/database/src/schema/001_core_enterprise_4nf_schema.sql packages/database/src/schema/02-seed-taxonomy.sql web-dist/schema/
          cat << 'SERVER_JS_EOF' > web-dist/server.js
          import fs from 'fs';
          import path from 'path';

          const rawAppMode = (
            process.env.NODE_ENV ||
            process.env.PASSENGER_APP_ENV ||
            process.env.APP_ENV ||
            process.env.APPLICATION_MODE ||
            'production'
          ).toLowerCase();

          const isDev = rawAppMode === 'development' || rawAppMode === 'dev';
          const primaryEnv = isDev ? '.env.development' : '.env.production';
          const fallbackEnv = isDev ? '.env.production' : '.env.development';

          function parseAndInjectEnv(filename) {
            const envFilePath = path.resolve(process.cwd(), filename);
            if (!fs.existsSync(envFilePath)) return false;
            try {
              const fileContent = fs.readFileSync(envFilePath, 'utf8');
              for (const line of fileContent.split('\n')) {
                const trimmed = line.trim();
                if (!trimmed || trimmed.startsWith('#')) continue;
                const eqIdx = trimmed.indexOf('=');
                if (eqIdx === -1) continue;
                const key = trimmed.slice(0, eqIdx).trim();
                let val = trimmed.slice(eqIdx + 1).trim();
                if ((val.startsWith('"') && val.endsWith('"')) || (val.startsWith("'") && val.endsWith("'"))) {
                  val = val.slice(1, -1);
                }
                if (key && process.env[key] === undefined) {
                  process.env[key] = val;
                }
              }
              return true;
            } catch {
              return false;
            }
          }

          const loaded = parseAndInjectEnv(primaryEnv);
          if (!loaded) {
            parseAndInjectEnv(fallbackEnv);
          }

          process.env.NODE_ENV = isDev ? 'development' : 'production';
          process.env.NEXT_PUBLIC_APP_MODE = isDev ? 'development' : 'production';

          import('./apps/web/server.js');
          SERVER_JS_EOF
          cp web-dist/server.js web-dist/app.js
          cd web-dist
          tar -czf ../web-build.tar.gz .

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web-build.tar.gz
          retention-days: 7

  build-api:
    name: Build API (Bundled Artifacts)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild argon2 against the target Node ABI
        run: |
          npm rebuild argon2 --build-from-source
          ls -1 node_modules/argon2/prebuilds/linux-x64 2>/dev/null || true


      - name: Bundle API with esbuild (compiled JS only, no TS sources)
        run: |
          npx esbuild apps/api/src/main.ts --bundle --platform=node --target=node20 --format=cjs --external:argon2 --external:@nestjs/microservices --external:@nestjs/microservices/* --external:@nestjs/websockets/* --outfile=apps/api/dist/main.cjs

      - name: Boot-check API bundle
        run: |
          set -euo pipefail
          API_SMOKE_LOG="$(mktemp)"
          NODE_ENV=production \
          PORT=3099 \
          HOST=127.0.0.1 \
          JWT_SECRET="$(openssl rand -hex 32)" \
          DB_HOST=127.0.0.1 DB_PORT=3306 DB_USER=smoke DB_PASSWORD=smoke DB_NAME=smoke DB_SSL=false \
          node apps/api/dist/main.cjs > "$API_SMOKE_LOG" 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true; rm -f "$API_SMOKE_LOG"' EXIT
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:3099/api/v1/health >/dev/null 2>&1; then
              echo "API bundle booted and /api/v1/health responded."; exit 0
            fi
            if ! kill -0 "$API_PID" 2>/dev/null; then
              echo "API bundle crashed during startup:"; cat "$API_SMOKE_LOG"; exit 1
            fi
            sleep 1
          done
          echo "API bundle did not boot within 30 seconds:"; cat "$API_SMOKE_LOG"; exit 1

      - name: Package API build (artifacts only, no TS sources)
        run: |
          mkdir -p api-dist/dist
          cp apps/api/dist/main.cjs api-dist/dist/
          cat << 'SERVER_JS_EOF' > api-dist/server.js
          import fs from 'fs';
          import path from 'path';
          import { fileURLToPath } from 'url';

          const appRoot = path.dirname(fileURLToPath(import.meta.url));

          const rawAppMode = (
            process.env.NODE_ENV ||
            process.env.PASSENGER_APP_ENV ||
            process.env.APP_ENV ||
            process.env.APPLICATION_MODE ||
            'production'
          ).toLowerCase();

          const isDev = rawAppMode === 'development' || rawAppMode === 'dev';
          const primaryEnv = isDev ? '.env.development' : '.env.production';
          const fallbackEnv = isDev ? '.env.production' : '.env.development';
          const runtimeOverrideKeys = new Set(['DB_HOST', 'DB_PORT', 'DB_USER', 'DB_PASSWORD', 'DB_NAME']);

          function parseAndInjectEnv(filename) {
            const envFilePath = path.resolve(appRoot, filename);
            if (!fs.existsSync(envFilePath)) return false;
            try {
              const fileContent = fs.readFileSync(envFilePath, 'utf8');
              for (const line of fileContent.split('\n')) {
                const trimmed = line.trim();
                if (!trimmed || trimmed.startsWith('#')) continue;
                const eqIdx = trimmed.indexOf('=');
                if (eqIdx === -1) continue;
                const key = trimmed.slice(0, eqIdx).trim();
                let val = trimmed.slice(eqIdx + 1).trim();
                if ((val.startsWith('"') && val.endsWith('"')) || (val.startsWith("'") && val.endsWith("'"))) {
                  val = val.slice(1, -1);
                }
                if (key && (process.env[key] === undefined || runtimeOverrideKeys.has(key))) {
                  process.env[key] = val;
                }
              }
              return true;
            } catch {
              return false;
            }
          }

          const loaded = parseAndInjectEnv(primaryEnv);
          if (!loaded) {
            parseAndInjectEnv(fallbackEnv);
          }

          process.env.NODE_ENV = isDev ? 'development' : 'production';

          import('./dist/main.cjs').catch((error) => {
            console.error('[API STARTUP ERROR]', error);
            process.exit(1);
          });
          SERVER_JS_EOF
          cp api-dist/server.js api-dist/app.js
          cat << 'PACKAGE_JSON_EOF' > api-dist/package.json
          {
            "name": "@pasok/api-runtime",
            "private": true,
            "type": "module",
            "dependencies": {
              "argon2": "^0.41.1"
            }
          }
          PACKAGE_JSON_EOF
          npm install --prefix api-dist --omit=dev --no-audit --no-fund
          npm rebuild --prefix api-dist argon2 --build-from-source
          ls -1 api-dist/node_modules/argon2/build/Release 2>/dev/null || echo "no argon2 build/Release (api)"
          cd api-dist
          tar -czf ../api-build.tar.gz .

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-build
          path: api-build.tar.gz
          retention-days: 7

  deploy-web:
    name: Deploy Web to Server
    runs-on: ubuntu-latest
    needs: [build-web]
    if: github.ref == 'refs/heads/main'
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.SSH_USER }}

    steps:
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build


      - name: Configure SSH credentials
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/known_hosts" "$HOME/.ssh/id_ed25519"
          test -s "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null

      - name: Extract web build on server
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '3306' }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          # Non-strict by default: a rejected DB login only produces a warning and the
          # schema/seed step is skipped. Set repository variable DB_VALIDATION_STRICT=true
          # (Settings > Secrets and variables > Actions > Variables) to fail the deploy again.
          DB_STRICT: ${{ vars.DB_VALIDATION_STRICT || 'false' }}
        run: |
          set -euo pipefail
          umask 077
          DB_CONFIG="pasokmataram-db.cnf"
          WEB_ENV_DB="web-env-db.fragment"
          trap 'rm -f "$DB_CONFIG" "$WEB_ENV_DB" deploy-web-remote.sh' EXIT
          {
            printf 'DB_HOST=%s\n' "$DB_HOST"
            printf 'DB_PORT=%s\n' "$DB_PORT"
            printf 'DB_USER=%s\n' "$DB_USER"
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'DB_NAME=%s\n' "$DB_NAME"
          } > "$WEB_ENV_DB"
          DB_CONFIG="$DB_CONFIG" node --input-type=commonjs <<'MYSQL_CONFIG'
          const fs = require('node:fs');
          const option = (name) => {
            const value = process.env[name];
            if (!value || /[\r\n\0]/.test(value)) {
              throw new Error(`${name} is missing or contains an unsupported control character.`);
            }
            return `"${value.replaceAll('\\', '\\\\').replaceAll('"', '\\"')}"`;
          };
          const config = [
            '[client]',
            `host=${option('DB_HOST')}`,
            `port=${option('DB_PORT')}`,
            `user=${option('DB_USER')}`,
            `password=${option('DB_PASSWORD')}`,
            `database=${option('DB_NAME')}`,
            '',
          ].join('\n');
          fs.writeFileSync(process.env.DB_CONFIG, config, { mode: 0o600 });
          MYSQL_CONFIG
          cat << 'REMOTE_SCRIPT' > deploy-web-remote.sh
          set -euo pipefail
          DB_STRICT="${1:-false}"
          DB_OK=1
          WEB_PATH="${{ secrets.WEB_DEPLOY_PATH }}"
          DB_CONFIG="$HOME/pasokmataram-db.cnf"
          DB_ERROR="$(mktemp)"
          trap 'rm -f "$DB_CONFIG" "$DB_ERROR" "$HOME/web-env-db.fragment"' EXIT

          # Any database problem: warn and skip DB steps, or stop (exit 78) in strict mode.
          db_problem() {
            echo "::warning::$1"
            if [ "$DB_STRICT" = "true" ]; then
              exit 78
            fi
            DB_OK=0
          }

          if [ ! -f "$DB_CONFIG" ]; then
            db_problem "Database option file missing on target host."
          else
            chmod 600 "$DB_CONFIG"
            if ! command -v mysql >/dev/null 2>&1; then
              db_problem "mysql client is not installed on the target host."
            elif ! mysql --defaults-extra-file="$DB_CONFIG" --batch --skip-column-names --execute='SELECT 1' >/dev/null 2>"$DB_ERROR"; then
              case "$(cat "$DB_ERROR")" in
                *"ERROR 1044"*) echo "Database validation failed: user lacks access to the selected database." ;;
                *"ERROR 1045"*)
                  echo "Database validation failed: credentials or MySQL host grant rejected."
                  accepted_endpoint=""
                  for endpoint in localhost 127.0.0.1; do
                    if mysql --defaults-extra-file="$DB_CONFIG" --host="$endpoint" --batch --skip-column-names --execute='SELECT 1' >/dev/null 2>&1; then
                      accepted_endpoint="$endpoint"
                      break
                    fi
                  done
                  if [ -n "$accepted_endpoint" ]; then
                    echo "Database endpoint diagnostic: credentials succeed through $accepted_endpoint; update DB_HOST to that endpoint."
                  else
                    echo "Database endpoint diagnostic: configured, localhost, and 127.0.0.1 endpoints all reject this user/password or its host grant."
                  fi
                  ;;
                *"ERROR 1049"*) echo "Database validation failed: database name does not exist." ;;
                *"ERROR 2002"*|*"ERROR 2003"*) echo "Database validation failed: database host or port is unreachable." ;;
                *) echo "Database validation failed on target host." ;;
              esac
              db_problem "Database check did not pass. Schema and taxonomy will be skipped; fix the DB_* secrets or the MySQL grant."
            fi
          fi
          rm -f "$DB_ERROR"

          mkdir -p "$WEB_PATH"
          if [ -f "$WEB_PATH/.htaccess" ]; then
            cp "$WEB_PATH/.htaccess" /tmp/preserved_web_htaccess 2>/dev/null || true
          fi

          if [ -d "$WEB_PATH" ]; then
            cp -r "$WEB_PATH" "${WEB_PATH}_backup_$(date +%Y%m%d_%H%M%S)" 2>/dev/null || true
            ls -dt ${WEB_PATH}_backup_* 2>/dev/null | tail -n +3 | xargs rm -rf 2>/dev/null || true
          fi

          tar -xzf ~/web-build.tar.gz -C "$WEB_PATH"
          rm -f ~/web-build.tar.gz
          web_env_file="$WEB_PATH/.env.production"
          if ! grep -qE '^[[:space:]]*REDIS_(SOCKET|URL)=' "$web_env_file" 2>/dev/null; then
            echo "::warning::$web_env_file tidak mendefinisikan REDIS_SOCKET atau REDIS_URL; cache, antrean, dan lock akan memakai fallback in-memory atau fail-closed sampai env dilengkapi."
          fi
          if [ -f "$HOME/web-env-db.fragment" ]; then
            if [ -f "$web_env_file" ]; then
              synced_env="$(mktemp)"
              grep -vE '^[[:space:]]*DB_(HOST|PORT|USER|PASSWORD|NAME)=' "$web_env_file" > "$synced_env" || true
              cat "$HOME/web-env-db.fragment" >> "$synced_env"
              mv "$synced_env" "$web_env_file"
            else
              cp "$HOME/web-env-db.fragment" "$web_env_file"
            fi
            rm -f "$HOME/web-env-db.fragment"
            chmod 644 "$web_env_file"
            echo "Web .env.production DB_* lines synchronized from deploy secrets."
            echo "Env diagnostics: user=$(id -un) | $(ls -ld "$WEB_PATH" | awk '{print $1, $3, $4}') | $(ls -l "$web_env_file" | awk '{print $1, $3, $4}') | server.js: $(ls -l "$WEB_PATH/server.js" 2>/dev/null | awk '{print $1, $3, $5}')"
            echo "htaccess head:"; sed -n '1,10p' "$WEB_PATH/.htaccess" 2>/dev/null || true
          fi
          if [ -f /tmp/preserved_web_htaccess ]; then
            if grep -q "CLOUDLINUX" /tmp/preserved_web_htaccess 2>/dev/null; then
              cat /tmp/preserved_web_htaccess > "$WEB_PATH/.htaccess"
            fi
            rm -f /tmp/preserved_web_htaccess
          fi

          if ! grep -q "ErrorDocument 404" "$WEB_PATH/.htaccess" 2>/dev/null; then
            echo "" >> "$WEB_PATH/.htaccess"
            echo "Options -Indexes" >> "$WEB_PATH/.htaccess"
            echo "DirectoryIndex disabled" >> "$WEB_PATH/.htaccess"
            echo "ErrorDocument 400 /" >> "$WEB_PATH/.htaccess"
            echo "ErrorDocument 401 /" >> "$WEB_PATH/.htaccess"
            echo "ErrorDocument 403 /403" >> "$WEB_PATH/.htaccess"
            echo "ErrorDocument 404 /404" >> "$WEB_PATH/.htaccess"
            echo "ErrorDocument 500 /" >> "$WEB_PATH/.htaccess"
            echo "ErrorDocument 502 /" >> "$WEB_PATH/.htaccess"
            echo "ErrorDocument 503 /" >> "$WEB_PATH/.htaccess"
            echo '<FilesMatch "^\.env|^\.git">' >> "$WEB_PATH/.htaccess"
            echo "    Order allow,deny" >> "$WEB_PATH/.htaccess"
            echo "    Deny from all" >> "$WEB_PATH/.htaccess"
            echo "</FilesMatch>" >> "$WEB_PATH/.htaccess"
          fi

          if [ "$DB_OK" = "1" ]; then
            for sql_file in "$WEB_PATH/schema/001_core_enterprise_4nf_schema.sql" "$WEB_PATH/schema/02-seed-taxonomy.sql"; do
              if [ ! -f "$sql_file" ]; then
                db_problem "Required SQL file missing: $sql_file"
                break
              fi
              if ! mysql --defaults-extra-file="$DB_CONFIG" < "$sql_file"; then
                db_problem "Applying $sql_file failed."
                break
              fi
            done
            if [ "$DB_OK" = "1" ]; then
              echo "Target schema and taxonomy applied."
            fi
          fi
          if [ "$DB_OK" != "1" ]; then
            echo "::warning::Web files were deployed WITHOUT applying schema and taxonomy (database step skipped)."
          fi

          app_node="$(ls -1d "$HOME"/nodevenv/*/*/bin/node 2>/dev/null | head -1 || true)"
          echo "App node: ${app_node:-none}"
          if [ -n "$app_node" ]; then
            echo "App node version: $("$app_node" -v 2>&1)"
            app_probe="$(cd "$WEB_PATH" && "$app_node" -e "console.log(require.resolve('argon2')); require('argon2').hash('x').then(()=>console.log('argon2-ok')).catch((e)=>console.log('argon2-fail', e.message))" 2>&1 | tail -4)"
            echo "Argon2 probe: $app_probe"
          fi
          : > "$WEB_PATH/stderr.log" 2>/dev/null || true
          mkdir -p "$WEB_PATH/tmp" && touch "$WEB_PATH/tmp/restart.txt"
          echo "Runtime user: $(id -un)"
          echo "Node procs: $(ps -u "$(id -un)" -o pid,etime,cmd 2>/dev/null | grep -c 'server.js' || true)"
          ps -u "$(id -un)" -o pid,etime,cmd 2>/dev/null | grep 'server.js' | head -3 || true
          echo "Env keys: $(cut -d= -f1 "$web_env_file" 2>/dev/null | tr '\n' ' ' | cut -c1-400)"
          echo "Web root first entries: $(ls -1 "$WEB_PATH" 2>/dev/null | head -20 | tr '\n' ' ')"
          echo "Node available: $(command -v node || echo no)"
          echo "Pasok logs: $(ls -1 "$HOME/logs" 2>/dev/null | grep -i pasok | head -5 | tr '\n' ' ' || true)"
          echo "Argon2 dirs: $(find "$WEB_PATH" -maxdepth 5 -type d -name argon2 2>/dev/null | head -5 | tr '\n' ' ')"
          echo "Home argon2 dirs: $(find "$HOME" -maxdepth 5 -type d -name argon2 2>/dev/null | sed "s|$HOME|~|" | head -8 | tr '\n' ' ')"
          for argon_env in "$WEB_PATH"/node_modules/argon2 "$WEB_PATH"/apps/web/node_modules/argon2; do
            if [ -d "$argon_env" ]; then
              echo "Argon2 at $argon_env: build=$(ls -1 "$argon_env/build/Release" 2>/dev/null | tr '\n' ' ') prebuilds=$(ls -1 "$argon_env/prebuilds/linux-x64" 2>/dev/null | tr '\n' ' ')"
            fi
          done
          if [ -f "$WEB_PATH/stderr.log" ]; then
            echo "Web stderr tail:"; tail -n 30 "$WEB_PATH/stderr.log" 2>/dev/null || true
          else
            echo "Web stderr: absent"
          fi
          echo "Passenger htaccess: $(grep -iE "passenger|node" "$WEB_PATH/.htaccess" 2>/dev/null | tr '\n' '|' | cut -c1-300)"
          echo "Tmp dir: $(ls -la "$WEB_PATH/tmp" 2>/dev/null | head -6 | tr '\n' '|' || true)"

          echo "Web deployed successfully with pure build artifacts and preserved .htaccess"
          REMOTE_SCRIPT

          SSH_OPTS="-i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=30 -o ConnectionAttempts=5 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"
          for i in 1 2 3 4 5; do
            echo "Remote deploy attempt $i of 5 on port ${{ env.SSH_PORT }}..."
            if ! scp -P "$SSH_PORT" $SSH_OPTS \
              web-build.tar.gz "$DB_CONFIG" "$WEB_ENV_DB" "$SSH_USER@$SSH_HOST:~/"; then
              echo "Artifact upload attempt $i failed."
            elif ssh -p "$SSH_PORT" $SSH_OPTS \
              "$SSH_USER@$SSH_HOST" "bash -l -s -- $DB_STRICT" < deploy-web-remote.sh; then
              echo "Web deploy completed on target host."
              exit 0
            else
              remote_status=$?
              if [ "$remote_status" -eq 78 ]; then
                echo "::error::Database configuration is invalid or inaccessible on the target host (strict mode). Update DB secrets or the MySQL host grant."
                exit 78
              fi
            fi
            if [ "$i" -lt 5 ]; then
              delay=$((i * 15))
              echo "Remote deploy attempt $i failed. Retrying in $delay seconds..."
              sleep "$delay"
            fi
          done
          echo "Web deploy failed after 5 attempts."
          exit 255

      - name: Health check web
        run: |
          sleep 15
          curl --fail --silent --show-error --max-time 10 "${{ secrets.WEB_URL }}"

  deploy-api:
    name: Deploy API to Server
    runs-on: ubuntu-latest
    needs: [deploy-web, build-api]
    if: github.ref == 'refs/heads/main'
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      SSH_USER: ${{ secrets.SSH_USER }}

    steps:
      - name: Download API build
        uses: actions/download-artifact@v4
        with:
          name: api-build


      - name: Configure SSH credentials
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/known_hosts" "$HOME/.ssh/id_ed25519"
          test -s "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null

      - name: Upload API build to server
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT || '3306' }}
          DB_USER: ${{ secrets.DB_USER }}
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        run: |
          set -euo pipefail
          umask 077
          API_ENV="pasokmataram-api.env.production"
          trap 'rm -f "$API_ENV"' EXIT
          {
            printf '%s\n' "$ENV_PRODUCTION"
            printf 'DB_HOST=%s\n' "$DB_HOST"
            printf 'DB_PORT=%s\n' "$DB_PORT"
            printf 'DB_USER=%s\n' "$DB_USER"
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'DB_NAME=%s\n' "$DB_NAME"
          } > "$API_ENV"
          SSH_OPTS="-i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=30 -o ConnectionAttempts=5 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"
          for i in 1 2 3; do
            echo "Upload attempt $i of 3 on port ${{ env.SSH_PORT }}..."
            if scp -P "$SSH_PORT" $SSH_OPTS \
              api-build.tar.gz "$API_ENV" \
              "$SSH_USER@$SSH_HOST:~/"; then
              echo "Upload succeeded."
              exit 0
            fi
            echo "Upload attempt $i failed. Retrying in 5 seconds..."
            sleep 5
          done
          echo "Upload failed after 3 attempts."
          exit 255

      - name: Extract API build on server
        run: |
          cat << 'REMOTE_SCRIPT' > deploy-api-remote.sh
          set -euo pipefail
          API_PATH="${{ secrets.API_DEPLOY_PATH }}"

          mkdir -p "$API_PATH"
          if [ -f "$API_PATH/.htaccess" ]; then
            cp "$API_PATH/.htaccess" /tmp/preserved_api_htaccess 2>/dev/null || true
          fi

          if [ -d "$API_PATH" ]; then
            cp -r "$API_PATH" "${API_PATH}_backup_$(date +%Y%m%d_%H%M%S)" 2>/dev/null || true
            ls -dt ${API_PATH}_backup_* 2>/dev/null | tail -n +3 | xargs rm -rf 2>/dev/null || true
          fi

          tar -xzf ~/api-build.tar.gz -C "$API_PATH"
          rm -f ~/api-build.tar.gz
          if [ -f ~/pasokmataram-api.env.production ]; then
            mv ~/pasokmataram-api.env.production "$API_PATH/.env.production"
          fi
          test -s "$API_PATH/.env.production"
          chmod 600 "$API_PATH/.env.production"

          if [ -f /tmp/preserved_api_htaccess ]; then
            if grep -q "CLOUDLINUX" /tmp/preserved_api_htaccess 2>/dev/null; then
              cat /tmp/preserved_api_htaccess > "$API_PATH/.htaccess"
            fi
            rm -f /tmp/preserved_api_htaccess
          fi

          if ! grep -q "ErrorDocument 404" "$API_PATH/.htaccess" 2>/dev/null; then
            echo "" >> "$API_PATH/.htaccess"
            echo "Options -Indexes" >> "$API_PATH/.htaccess"
            echo "DirectoryIndex disabled" >> "$API_PATH/.htaccess"
            echo "ErrorDocument 400 /" >> "$API_PATH/.htaccess"
            echo "ErrorDocument 401 /" >> "$API_PATH/.htaccess"
            echo "ErrorDocument 403 /403" >> "$API_PATH/.htaccess"
            echo "ErrorDocument 404 /404" >> "$API_PATH/.htaccess"
            echo "ErrorDocument 500 /" >> "$API_PATH/.htaccess"
            echo "ErrorDocument 502 /" >> "$API_PATH/.htaccess"
            echo "ErrorDocument 503 /" >> "$API_PATH/.htaccess"
            echo '<FilesMatch "^\.env|^\.git">' >> "$API_PATH/.htaccess"
            echo "    Order allow,deny" >> "$API_PATH/.htaccess"
            echo "    Deny from all" >> "$API_PATH/.htaccess"
            echo "</FilesMatch>" >> "$API_PATH/.htaccess"
          fi

          mkdir -p "$API_PATH/tmp" && touch "$API_PATH/tmp/restart.txt"

          echo "API deployed successfully with pure build artifacts and preserved .htaccess"
          REMOTE_SCRIPT

          SSH_OPTS="-i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=30 -o ConnectionAttempts=5 -o ServerAliveInterval=15 -o ServerAliveCountMax=3"
          trap 'rm -f deploy-api-remote.sh' EXIT
          for i in 1 2 3 4 5; do
            echo "Remote deploy attempt $i of 5 on port ${{ env.SSH_PORT }}..."
            if ssh -p "$SSH_PORT" $SSH_OPTS \
              "$SSH_USER@$SSH_HOST" "bash -l" < deploy-api-remote.sh; then
              echo "API deploy completed on target host."
              exit 0
            fi
            if [ "$i" -lt 5 ]; then
              delay=$((i * 15))
              echo "Remote deploy attempt $i failed. Retrying in $delay seconds..."
              sleep "$delay"
            fi
          done
          echo "API deploy failed after 5 attempts."
          exit 255

      - name: Health check API
        run: |
          set -euo pipefail
          api_base="${{ secrets.API_URL }}"
          api_base="${api_base%/}"
          api_base="${api_base%/api/v1}"
          api_base="${api_base%/}"
          for i in $(seq 1 10); do
            if curl --fail --location --silent --show-error --max-time 30 "${api_base}/api/v1/health"; then
              echo ""; echo "API healthy after attempt $i"; exit 0
            fi
            echo "API health attempt $i failed"; sleep 15
          done
          echo "API unhealthy after 10 attempts"; exit 1

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-web, deploy-api]
    if: always() && github.ref == 'refs/heads/main'

    steps:
      - name: Generate summary
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Component | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Web (Next.js) | ${{ needs.deploy-web.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| API (NestJS) | ${{ needs.deploy-api.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Author: @${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Time: $(date -u)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: target-host runtime configuration" >> "$GITHUB_STEP_SUMMARY"