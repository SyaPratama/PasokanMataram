name: Deploy to Production (SCP Method)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy via SCP
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build production
        run: npm run build
      
      - name: Create deployment archive
        run: |
          tar -czf deploy.tar.gz \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='tests' \
            --exclude='*.test.ts' \
            --exclude='coverage' \
            --exclude='.env*' \
            --exclude='.turbo' \
            --exclude='deploy.tar.gz' \
            .
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      
      - name: Test SSH connection
        run: |
          ssh -o ConnectTimeout=10 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "echo '✅ SSH connected'"
      
      - name: Upload via SCP
        run: |
          scp -o StrictHostKeyChecking=no deploy.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/deploy.tar.gz
      
      - name: Extract & deploy on server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            
            # Backup existing deployment
            if [ -d "${{ secrets.DEPLOY_PATH }}" ]; then
              BACKUP_DIR="${{ secrets.DEPLOY_PATH }}_backup_$(date +%Y%m%d_%H%M%S)"
              echo "📦 Creating backup: $BACKUP_DIR"
              cp -r ${{ secrets.DEPLOY_PATH }} $BACKUP_DIR
              ls -dt ${{ secrets.DEPLOY_PATH }}_backup_* | tail -n +4 | xargs rm -rf || true
            fi
            
            # Create deployment directory
            mkdir -p ${{ secrets.DEPLOY_PATH }}
            
            # Extract new deployment
            echo "📤 Extracting deployment..."
            tar -xzf ~/deploy.tar.gz -C ${{ secrets.DEPLOY_PATH }}
            rm ~/deploy.tar.gz
            
            # Install production dependencies
            cd ${{ secrets.DEPLOY_PATH }}
            echo "📥 Installing dependencies..."
            npm ci --production 2>/dev/null || npm install --production
            
            # Setup PM2
            if ! command -v pm2 &> /dev/null; then
              echo "📦 Installing PM2..."
              npm install -g pm2
            fi
            
            # Restart services
            echo "🔄 Restarting services..."
            cd apps/web
            pm2 restart pasokmataram-web 2>/dev/null || pm2 start npm --name "pasokmataram-web" -- start
            cd ../..
            
            pm2 save
            pm2 list
            
            echo "✅ Deployment completed!"
          EOF
      
      - name: Health check
        run: |
          echo "⏳ Waiting 15 seconds for service startup..."
          sleep 15
          
          if curl --fail --silent --max-time 10 ${{ secrets.APP_URL }}; then
            echo "✅ Health check passed"
          else
            echo "⚠️ Health check failed but deployment completed"
          fi
        continue-on-error: true
      
      - name: Deployment summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ secrets.APP_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Author:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Method: SCP + tar (no rsync required)" >> $GITHUB_STEP_SUMMARY
