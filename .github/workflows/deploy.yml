name: Deploy

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      environment:
        description: Target deployment environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}-${{ github.event.inputs.environment || (github.event_name == 'release' && 'production') || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=ref,event=branch

      - name: Build and Push Docker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging Environment
    needs: [build-and-push]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.pasokmataram.com
    steps:
      - name: Checkout Deployment Scripts
        uses: actions/checkout@v4

      - name: Deploy Container to Staging Host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SERVER_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker stop pasokmataram-staging || true
            docker rm pasokmataram-staging || true
            docker run -d \
              --name pasokmataram-staging \
              --restart unless-stopped \
              -p 3000:3000 \
              -e NODE_ENV=production \
              -e PORT=3000 \
              -e NEXT_PUBLIC_APP_URL=https://staging.pasokmataram.com \
              -e DATABASE_URL="${{ secrets.STAGING_DATABASE_URL }}" \
              -e REDIS_URL="${{ secrets.STAGING_REDIS_URL }}" \
              -e JWT_SECRET="${{ secrets.STAGING_JWT_SECRET }}" \
              -e MINIO_ENDPOINT="${{ secrets.STAGING_MINIO_ENDPOINT }}" \
              -e MINIO_ACCESS_KEY="${{ secrets.STAGING_MINIO_ACCESS_KEY }}" \
              -e MINIO_SECRET_KEY="${{ secrets.STAGING_MINIO_SECRET_KEY }}" \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker system prune -f

  deploy-production:
    name: Deploy to Production Environment
    needs: [build-and-push]
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pasokmataram.com
    steps:
      - name: Checkout Deployment Scripts
        uses: actions/checkout@v4

      - name: Deploy Container to Production Host
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker stop pasokmataram-prod || true
            docker rm pasokmataram-prod || true
            docker run -d \
              --name pasokmataram-prod \
              --restart unless-stopped \
              -p 3000:3000 \
              -e NODE_ENV=production \
              -e PORT=3000 \
              -e NEXT_PUBLIC_APP_URL=https://pasokmataram.com \
              -e DATABASE_URL="${{ secrets.PROD_DATABASE_URL }}" \
              -e REDIS_URL="${{ secrets.PROD_REDIS_URL }}" \
              -e JWT_SECRET="${{ secrets.PROD_JWT_SECRET }}" \
              -e MINIO_ENDPOINT="${{ secrets.PROD_MINIO_ENDPOINT }}" \
              -e MINIO_ACCESS_KEY="${{ secrets.PROD_MINIO_ACCESS_KEY }}" \
              -e MINIO_SECRET_KEY="${{ secrets.PROD_MINIO_SECRET_KEY }}" \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker system prune -f
