name: Docker Container Build & CD

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'Dockerfile'
      - 'apps/**'
      - 'packages/**'
      - 'services/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify-containers:
    name: Build & Verify Container Images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: web
            dockerfile: docker/web.Dockerfile
          - component: api
            dockerfile: docker/api.Dockerfile
          - component: worker
            dockerfile: docker/worker.Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: pasokmataram-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify built container image
        run: |
          docker image inspect pasokmataram-${{ matrix.component }}:${{ github.sha }} > /dev/null
          echo "Verified image pasokmataram-${{ matrix.component }}:${{ github.sha }} successfully."
